apiVersion: v1
kind: Namespace
metadata:
  name: hello-zele-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: manager
  namespace: hello-zele-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: hello-zele-manager-role
  rules:
    - apiGroups: [""]
      resources: ["namespaces"]
      verbs: ["get", "list", "watch", "create", "update", "patch"]
    - apiGroups: [""]
      resources: ["resourcequotas"]
      verbs: ["get", "list", "watch", "create", "update", "patch"]
    - apiGroups: ["orgs.zele.space"]
      resources: ["organizations", "organizations/status", "organizations/finalizers"]
      verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
    - apiGroups: ["orgs.zele.space"]
      resources: ["groups", "groups/status", "groups/finalizers"]
      verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: hello-zele-manager-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: hello-zele-manager-role
subjects:
  - kind: ServiceAccount
    name: manager
    namespace: hello-zele-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller-manager
  namespace: hello-zele-system
spec:
  replicas: 1
  selector:
    matchLabels:
      control-plane: controller-manager
  template:
    metadata:
      labels:
        control-plane: controller-manager
    spec:
      serviceAccountName: manager
      containers:
        - name: manager
          image: hello-zele-operator:latest
          imagePullPolicy: IfNotPresent
          args:
            - "--health-probe-bind-address=:8081"
            - "--metrics-bind-address=:8080"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
