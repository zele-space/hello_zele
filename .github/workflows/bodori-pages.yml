name: Publish Bodori Adventure and Novel Setup
on:
  push:
    branches: [master]
    paths:
      - 'bodori/**'
      - 'novel_setup.html'
      - '.github/workflows/bodori-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: bodori-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check game JavaScript
        run: node --check bodori/game.js
      - name: Verify game in desktop and mobile browsers
        run: |
          npm install --prefix "$RUNNER_TEMP/bodori-qa" --no-save playwright-core
          BODORI_QA_MODULE="$RUNNER_TEMP/bodori-qa/node_modules/playwright-core" BODORI_CHROME="/usr/bin/google-chrome" node .github/scripts/bodori-browser-qa.cjs
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Prepare game and novel setup site
        run: |
          mkdir -p _site/novel
          cp -a bodori/. _site/
          cp novel_setup.html _site/novel/index.html
          cp novel_setup.html _site/novel_setup.html
      - name: Upload game and novel setup
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy game
        id: deployment
        uses: actions/deploy-pages@v4
